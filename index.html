<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Design Digest</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --text: #1A1A1A;
    --text-secondary: #6B6B6B;
    --text-tertiary: #999;
    --accent: #E8590C;
    --accent-light: #FFF4E6;
    --border: #EBEBEB;
    --tag-bg: #F5F5F3;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --transition: 0.2s ease;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* Layout */
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Header */
  header {
    padding: 48px 0 32px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }

  header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }

  header p {
    font-size: 15px;
    color: var(--text-secondary);
    max-width: 480px;
  }

  /* Tab Navigation */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 32px;
    background: var(--tag-bg);
    padding: 4px;
    border-radius: var(--radius);
    width: fit-content;
  }

  .tab {
    padding: 8px 20px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
  }

  .tab:hover { color: var(--text); }

  .tab.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }

  /* Sections */
  .section { display: none; }
  .section.active { display: block; }

  /* Date group */
  .date-group { margin-bottom: 40px; }

  .date-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  /* Article Card */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    margin-bottom: 12px;
    border: 1px solid var(--border);
    transition: all var(--transition);
    text-decoration: none;
    display: block;
    color: inherit;
    overflow: hidden;
  }

  .card:hover {
    border-color: #ddd;
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }

  .card-body {
    padding: 24px;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .card-source {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    padding: 3px 10px;
    border-radius: 99px;
  }

  .card-date {
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .card h3 {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 12px;
    letter-spacing: -0.2px;
  }

  .card-content {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .card-thumb {
    width: 72px;
    height: 72px;
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--tag-bg);
  }

  .card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .card-summary {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
    min-width: 0;
  }

  .card-summary-full {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-why {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    font-style: italic;
  }

  .card-why::before {
    content: "Why: ";
    font-weight: 600;
    font-style: normal;
    color: var(--accent);
  }

  .expand-btn {
    display: inline-block;
    margin-top: 8px;
    font-size: 13px;
    color: var(--accent);
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
    font-weight: 500;
  }

  .expand-btn:hover { text-decoration: underline; }

  /* Skills Section */
  .skills-grid {
    display: grid;
    gap: 12px;
  }

  .skill-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: all var(--transition);
  }

  .skill-card:hover {
    border-color: #ddd;
    box-shadow: var(--shadow-md);
  }

  .skill-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .skill-name {
    font-size: 15px;
    font-weight: 600;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    color: var(--text);
  }

  .skill-tag {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 99px;
    background: var(--tag-bg);
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .skill-tag[data-tag="AI"] { background: #EEF2FF; color: #4338CA; }
  .skill-tag[data-tag="design"] { background: #FDF2F8; color: #BE185D; }
  .skill-tag[data-tag="workflow"] { background: #ECFDF5; color: #047857; }

  .skill-desc {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .skill-badge {
    display: inline-block;
    margin-top: 8px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    background: #ECFDF5;
    color: #047857;
  }

  .skill-section-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 16px;
    letter-spacing: -0.3px;
  }

  .skill-section { margin-bottom: 40px; }

  .trending-rank {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-tertiary);
    margin-right: 8px;
    min-width: 20px;
  }

  .trending-installs {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-left: auto;
  }

  /* Footer */
  footer {
    margin-top: 64px;
    padding: 24px 0;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 13px;
    color: var(--text-tertiary);
    margin-bottom: 48px;
  }

  footer a {
    color: var(--accent);
    text-decoration: none;
  }

  footer a:hover { text-decoration: underline; }

  /* Loading */
  .loading {
    text-align: center;
    padding: 48px;
    color: var(--text-tertiary);
    font-size: 14px;
  }

  /* Responsive */
  @media (max-width: 640px) {
    header { padding: 32px 0 24px; }
    header h1 { font-size: 24px; }
    .card-body { padding: 18px; }
    .card h3 { font-size: 16px; }
    .card-thumb { width: 64px; height: 64px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Daily Design Digest</h1>
    <p>AI x Design 领域每日精选文章与热门 Skill 推荐，由 Claw 自动策展</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="articles">Articles</button>
    <button class="tab" data-tab="skills">Skills</button>
  </div>

  <div id="articles" class="section active">
    <div class="loading">Loading articles...</div>
  </div>

  <div id="skills" class="section">
    <div class="loading">Loading skills...</div>
  </div>

  <footer>
    Curated daily by <a href="https://github.com/han10000/daily-design-digest">Claw</a> &middot; Updated <span id="last-updated">—</span>
  </footer>
</div>

<script>
  // Tab switching
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(tab.dataset.tab).classList.add('active');
    });
  });

  // Format date
  function formatDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const now = new Date();
    const today = now.toISOString().slice(0, 10);
    const yesterday = new Date(now - 86400000).toISOString().slice(0, 10);
    if (dateStr === today) return 'Today';
    if (dateStr === yesterday) return 'Yesterday';
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[d.getMonth()]} ${d.getDate()}`;
  }

  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Render articles
  fetch('feed.json')
    .then(r => r.json())
    .then(data => {
      const container = document.getElementById('articles');
      container.innerHTML = '';

      if (data.length > 0) {
        document.getElementById('last-updated').textContent = formatDate(data[0].date);
      }

      data.forEach(group => {
        const div = document.createElement('div');
        div.className = 'date-group';
        div.innerHTML = `<div class="date-label">${formatDate(group.date)}</div>`;

        group.items.forEach(item => {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = item.url;
          card.target = '_blank';
          card.rel = 'noopener';

          const pubDate = item.publishedAt ? formatDate(item.publishedAt) : '';
          const hasImg = !!item.image;

          let contentHtml = '';
          if (hasImg && item.summary) {
            contentHtml = `<div class="card-content">
              <div class="card-summary">${escHtml(item.summary)}</div>
              <div class="card-thumb"><img src="${escHtml(item.image)}" alt="" loading="lazy" onerror="this.parentNode.style.display='none'"></div>
            </div>`;
          } else if (item.summary) {
            contentHtml = `<div class="card-summary-full">${escHtml(item.summary)}</div>`;
          }

          card.innerHTML = `
            <div class="card-body">
              <div class="card-meta">
                <span class="card-source">${escHtml(item.source)}</span>
                ${pubDate ? `<span class="card-date">${pubDate}</span>` : ''}
              </div>
              <h3>${escHtml(item.title)}</h3>
              ${contentHtml}
              ${item.why ? `<div class="card-why">${escHtml(item.why)}</div>` : ''}
            </div>
          `;
          div.appendChild(card);
        });

        container.appendChild(div);
      });
    })
    .catch(() => {
      document.getElementById('articles').innerHTML = '<div class="loading">Failed to load articles</div>';
    });

  // Render skills
  fetch('skills-data.json')
    .then(r => r.json())
    .then(data => {
      const container = document.getElementById('skills');
      container.innerHTML = '';

      // Trending skills
      if (data.trending && data.trending.length > 0) {
        const section = document.createElement('div');
        section.className = 'skill-section';
        section.innerHTML = '<div class="skill-section-title">Trending Skills</div>';
        const grid = document.createElement('div');
        grid.className = 'skills-grid';

        data.trending.forEach(skill => {
          const card = document.createElement('div');
          card.className = 'skill-card';
          const tag = skill.tag || '';
          card.innerHTML = `
            <div class="skill-header">
              <span style="display:flex;align-items:center;gap:4px;">
                <span class="trending-rank">#${skill.rank}</span>
                <span class="skill-name">${escHtml(skill.name)}</span>
              </span>
              <span style="display:flex;align-items:center;gap:8px;">
                ${skill.installs ? `<span class="trending-installs">${escHtml(skill.installs)} installs</span>` : ''}
                ${tag ? `<span class="skill-tag" data-tag="${escHtml(tag)}">${escHtml(tag)}</span>` : ''}
              </span>
            </div>
            <div class="skill-desc">${escHtml(skill.desc || '—')}</div>
            ${skill.source ? `<div style="margin-top:6px;font-size:12px;color:#999;">via ${escHtml(skill.source)}</div>` : ''}
          `;
          grid.appendChild(card);
        });

        section.appendChild(grid);
        container.appendChild(section);
      }
    })
    .catch(() => {
      document.getElementById('skills').innerHTML = '<div class="loading">Failed to load skills</div>';
    });
</script>

</body>
</html>
